name: Report a problem
description: Something in the music or video workspace is not working.
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: For example, 1.50.0
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Computer
      options:
        - Windows
        - Linux
        - Mac with an M-series chip
        - Mac with an Intel chip
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Extra details
      description: Optional screenshots, relevant plugins, installation format, or logs.

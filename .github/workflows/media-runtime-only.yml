name: Check existing desktop downloads

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Build desktop downloads run containing the verified Media artifacts
        type: string
        required: true
      publish:
        description: Publish the existing downloads only after all runtime checks pass
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    name: Packaged ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check runtime verification transport
        run: node --test _scripts/cdp.test.mjs _scripts/native-handshake.test.mjs
      - name: Record and validate source build
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';
          const { SOURCE_RUN_ID: runId, GITHUB_REPOSITORY: repository, GH_TOKEN: token } = process.env;
          assert(/^[0-9]+$/.test(runId), 'Source run ID must be numeric.');
          const response = await fetch(`https://api.github.com/repos/${repository}/actions/runs/${runId}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            signal: AbortSignal.timeout(30000),
          });
          assert(response.ok, `Source build lookup failed: ${response.status}`);
          const source = await response.json();
          assert.equal(source.head_repository.full_name, repository, 'Source build must belong to this repository.');
          assert.equal(source.path, '.github/workflows/media-release.yml', 'Source artifacts must come from Build desktop downloads.');
          assert(/^[a-f0-9]{40}$/.test(source.head_sha));
          const comparisonResponse = await fetch(`https://api.github.com/repos/${repository}/compare/${source.head_sha}...${process.env.GITHUB_SHA}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
            signal: AbortSignal.timeout(30000),
          });
          assert(comparisonResponse.ok, `Source comparison failed: ${comparisonResponse.status}`);
          const comparison = await comparisonResponse.json();
          assert(['ahead', 'identical'].includes(comparison.status), 'Runtime scripts must descend from the built source.');
          assert(comparison.total_commits < 100 && comparison.files.length < 300, 'The source comparison is incomplete.');
          const verificationFiles = new Set([
            '.github/workflows/media-runtime-only.yml',
            '_scripts/cdp.mjs',
            '_scripts/cdp.test.mjs',
            '_scripts/smoke-portable.mjs',
            '_scripts/native-handshake.mjs',
            '_scripts/native-handshake.test.mjs',
            'packages/player/src/views/Artist/Artist.test-wrapper.tsx',
            'packages/player/src/views/Artist/Artist.test.tsx',
            'packages/player/src/views/Artist/__snapshots__/Artist.test.tsx.snap',
          ]);
          assert(comparison.files.every(file => verificationFiles.has(file.filename) && (!file.previous_filename || verificationFiles.has(file.previous_filename))), 'The application source changed after these downloads were built. Build fresh downloads instead.');
          await mkdir('build/runtime-artifact', { recursive: true });
          await writeFile('build/runtime-artifact/provenance.json', JSON.stringify({ sourceRunId: source.id, sourceCommit: source.head_sha, scriptCommit: process.env.GITHUB_SHA, sourceConclusion: source.conclusion }, null, 2));
          NODE
      - uses: actions/download-artifact@v8
        with:
          name: Media-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/releases
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded checksums
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';
          const checksums = (await readFile('build/releases/SHA256SUMS.txt', 'utf8')).trim().split(/\r?\n/);
          assert(checksums.length > 0, 'The artifact has no checksums.');
          const filenames = new Set();
          for (const line of checksums) {
            const match = /^([a-f0-9]{64})  (.+)$/.exec(line);
            assert(match && path.basename(match[2]) === match[2], 'Invalid checksum entry.');
            assert(!filenames.has(match[2]), 'Duplicate checksum entry.');
            filenames.add(match[2]);
            const digest = createHash('sha256');
            for await (const chunk of createReadStream(path.join('build/releases', match[2]))) digest.update(chunk);
            assert.equal(digest.digest('hex'), match[1], `Downloaded checksum mismatch: ${match[2]}`);
          }
          assert.deepEqual([...filenames].sort(), (await readdir('build/releases')).filter(name => name !== 'SHA256SUMS.txt').sort(), 'Every downloaded package must have a checksum.');
          NODE
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libappindicator3-1 libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libasound2 libgbm1 libfuse2 xvfb xauth dbus gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Extract Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskArchive = @(Get-ChildItem -LiteralPath build/releases -File -Filter '*-windows-x64-portable.zip')
          if ($taskArchive.Count -ne 1) { throw 'Expected one Windows portable download.' }
          $taskStage = [IO.Path]::GetFullPath('build/runtime-artifact/windows')
          Expand-Archive -LiteralPath $taskArchive[0].FullName -DestinationPath $taskStage
          $taskExecutable = @(Get-ChildItem -LiteralPath $taskStage -Recurse -File -Filter Media.exe)
          if ($taskExecutable.Count -ne 1) { throw 'Expected one portable Media.exe.' }
          "MEDIA_QA_EXECUTABLE=$($taskExecutable[0].FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Extract Linux AppImage payload
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t packages < <(find "$PWD/build/releases" -maxdepth 1 -type f -name '*-linux-x64.AppImage')
          test "${#packages[@]}" -eq 1
          mkdir -p build/runtime-artifact/linux
          chmod +x "${packages[0]}"
          cd build/runtime-artifact/linux
          "${packages[0]}" --appimage-extract > extraction.log
          echo "MEDIA_QA_EXECUTABLE=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Copy and validate Mac app from downloaded DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          packages=("$PWD"/build/releases/*-macos-${{ matrix.arch }}.dmg)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          mkdir -p build/runtime-artifact/macos/mount
          mount_path="$PWD/build/runtime-artifact/macos/mount"
          hdiutil attach "${packages[0]}" -nobrowse -readonly -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path"' EXIT
          ditto "$mount_path/Media.app" "$PWD/build/runtime-artifact/macos/Media.app"
          codesign --verify --deep --strict "$PWD/build/runtime-artifact/macos/Media.app"
          echo "MEDIA_QA_EXECUTABLE=$PWD/build/runtime-artifact/macos/Media.app/Contents/MacOS/Media" >> "$GITHUB_ENV"
      - name: Open packaged app and check workspace navigation
        if: runner.os != 'Linux'
        shell: bash
        run: node _scripts/smoke-portable.mjs --arch ${{ matrix.arch }} --executable "$MEDIA_QA_EXECUTABLE"
      - name: Open Linux packaged app and check sandbox and navigation
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node _scripts/smoke-portable.mjs --arch ${{ matrix.arch }} --executable "$MEDIA_QA_EXECUTABLE"
      - name: Save runtime report and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Runtime-artifact-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/verify/${{ matrix.platform }}-${{ matrix.arch }}/runtime.*
            build/runtime-artifact/provenance.json
          if-no-files-found: warn

  publish:
    name: Publish verified existing downloads
    if: inputs.publish
    needs: runtime
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: Media-*
          path: build/releases
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: Runtime-artifact-macos-x64
          path: build/runtime-source
      - name: Verify release files and generate combined checksums
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, readdir } from 'node:fs/promises';
          import { writeChecksums } from './_scripts/checksums.mjs';
          const { version } = JSON.parse(await readFile('packages/player/src-tauri/tauri.conf.json', 'utf8'));
          const expected = [
            `Media-${version}-windows-x64-setup.exe`, `Media-${version}-windows-x64-portable.zip`,
            `Media-${version}-linux-x64.deb`, `Media-${version}-linux-x64.AppImage`,
            `Media-${version}-macos-arm64.dmg`, `Media-${version}-macos-x64.dmg`, 'SHA256SUMS.txt',
          ].sort();
          assert.deepEqual((await readdir('build/releases')).sort(), expected);
          const report = JSON.parse(await readFile('build/runtime-source/runtime.json', 'utf8'));
          const provenance = JSON.parse(await readFile('build/runtime-source/provenance.json', 'utf8'));
          assert.equal(report.passed, true);
          assert.equal(provenance.sourceRunId, Number(process.env.SOURCE_RUN_ID));
          assert.equal(provenance.scriptCommit, process.env.GITHUB_SHA);
          assert(/^[a-f0-9]{40}$/.test(provenance.sourceCommit));
          await writeChecksums('build/releases');
          NODE
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      - name: Publish downloads from the verified build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/player/src-tauri/tauri.conf.json').version")
          source_commit=$(node -p "require('./build/runtime-source/provenance.json').sourceCommit")
          if tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq '.object.sha'); then
            test "$tag_commit" = "$source_commit"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$version" -f "sha=$source_commit"
          fi
          gh release create "v$version" build/releases/* --verify-tag --title "Media v$version" --notes-file docs/RELEASE_NOTES.md

name: Check application

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: media-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build:frontend --filter=@nuclearplayer/player
      - run: pnpm --filter @nuclearplayer/player test -- src/views/Videos/Videos.test.tsx src/components/ConnectedVideoNavigation.test.tsx src/views/Personalization/Personalization.test.tsx src/views/Personalization/PersonalizationSetup.test.tsx
      - run: node _scripts/build-portable.mjs --plan
      - run: node --check _scripts/build-portable.mjs

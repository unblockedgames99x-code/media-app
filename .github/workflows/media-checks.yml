name: Check application

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: media-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test _scripts/cdp.test.mjs
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build:frontend --filter=@nuclearplayer/player
      - name: Check the complete player and music playback actions
        run: pnpm --filter @nuclearplayer/player exec vitest --run
      - name: Check audio playback behavior
        run: pnpm --filter @nuclearplayer/hifi exec vitest --run
      - name: Check music volume controls
        run: pnpm --filter @nuclearplayer/ui exec vitest --run src/components/PlayerBar/PlayerBar.test.tsx
      - run: node _scripts/build-portable.mjs --plan
      - run: node --check _scripts/build-portable.mjs

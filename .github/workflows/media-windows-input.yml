name: Check Windows keyboard on an existing download

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Build desktop downloads run containing the Windows package
        type: string
        required: true
      expected_home_heading:
        description: Heading present in the downloaded application
        type: string
        default: Goodtube - Noads No sponsors No distractions

permissions:
  contents: read
  actions: read

jobs:
  keyboard:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check runtime verification and input driver guards
        run: node --test _scripts/cdp.test.mjs _scripts/windows-input-test.test.mjs
      - name: Record source package provenance
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          const assert = require('node:assert/strict');
          const { mkdir, writeFile } = require('node:fs/promises');
          (async () => {
            const { SOURCE_RUN_ID: runId, GITHUB_REPOSITORY: repository, GH_TOKEN: token } = process.env;
            assert(/^[0-9]+$/.test(runId), 'Source run ID must be numeric.');
            const response = await fetch(`https://api.github.com/repos/${repository}/actions/runs/${runId}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(30000),
            });
            assert(response.ok, `Source build lookup failed: ${response.status}`);
            const source = await response.json();
            assert.equal(source.head_repository.full_name, repository);
            assert.equal(source.path, '.github/workflows/media-release.yml');
            assert.equal(source.conclusion, 'success');
            assert(/^[a-f0-9]{40}$/.test(source.head_sha));
            await mkdir('build/verify/windows-x64', { recursive: true });
            await writeFile('build/verify/windows-x64/provenance.json', JSON.stringify({ sourceRunId: source.id, sourceCommit: source.head_sha, scriptCommit: process.env.GITHUB_SHA, purpose: 'Windows native keyboard regression on an existing download' }, null, 2));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          '@ | node
      - uses: actions/download-artifact@v8
        with:
          name: Media-windows-x64
          path: build/releases
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded package checksums
        run: |
          @'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { createReadStream } = require('node:fs');
          const { readFile, readdir } = require('node:fs/promises');
          const path = require('node:path');
          (async () => {
            const directory = 'build/releases';
            const filenames = new Set();
            for (const line of (await readFile(path.join(directory, 'SHA256SUMS.txt'), 'utf8')).trim().split(/\r?\n/)) {
              const match = /^([a-f0-9]{64})  (.+)$/.exec(line);
              assert(match && path.basename(match[2]) === match[2]);
              assert(!filenames.has(match[2]));
              filenames.add(match[2]);
              const digest = createHash('sha256');
              for await (const chunk of createReadStream(path.join(directory, match[2]))) digest.update(chunk);
              assert.equal(digest.digest('hex'), match[1]);
            }
            assert.deepEqual([...filenames].sort(), (await readdir(directory)).filter(name => name !== 'SHA256SUMS.txt').sort());
          })().catch(error => { console.error(error); process.exitCode = 1; });
          '@ | node
      - name: Extract the verified portable app
        run: |
          $taskArchives = @(Get-ChildItem -LiteralPath build/releases -File -Filter '*-windows-x64-portable.zip')
          if ($taskArchives.Count -ne 1) { throw 'Expected exactly one Windows portable archive.' }
          $taskStage = [IO.Path]::GetFullPath('build/runtime-keyboard/windows')
          Expand-Archive -LiteralPath $taskArchives[0].FullName -DestinationPath $taskStage
          $taskExecutables = @(Get-ChildItem -LiteralPath $taskStage -Recurse -File -Filter Media.exe)
          if ($taskExecutables.Count -ne 1) { throw 'Expected exactly one portable application.' }
          "MEDIA_QA_EXECUTABLE=$($taskExecutables[0].FullName)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test real Windows mouse and keyboard routing
        env:
          EXPECTED_HOME_HEADING: ${{ inputs.expected_home_heading }}
        run: node _scripts/smoke-portable.mjs --executable "$env:MEDIA_QA_EXECUTABLE" --expected-home-heading "$env:EXPECTED_HOME_HEADING"
      - name: Save keyboard diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Runtime-windows-keyboard
          path: |
            build/verify/windows-x64/runtime.*
            build/verify/windows-x64/provenance.json
          if-no-files-found: warn

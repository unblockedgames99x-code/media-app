name: Build desktop downloads

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish downloads after every platform passes
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: media-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      DO_NOT_TRACK: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check release version
        run: node _scripts/check-release-version.mjs
      - name: Check packaged runtime verification
        run: node --test _scripts/cdp.test.mjs
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache/restore@v6
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/player/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('packages/player/src-tauri/Cargo.lock') }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0 libasound2 libgbm1 libfuse2 xvfb xauth gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - name: Install application dependencies
        run: pnpm install --frozen-lockfile
      - name: Install video dependencies
        working-directory: engines/cartertube
        run: pnpm install --frozen-lockfile
      - name: Download video runtime
        working-directory: engines/cartertube
        run: node node_modules/electron/install.js
      - name: Check video playback contracts
        working-directory: engines/cartertube
        run: pnpm test
      - name: Build installers and portable download
        run: pnpm media:build --arch ${{ matrix.arch }} --target ${{ matrix.target }}
      - name: Check native integration contracts
        working-directory: packages/player/src-tauri
        run: |
          cargo test --release video_engine --lib --target ${{ matrix.target }}
          cargo test --release deep_links --lib --target ${{ matrix.target }}
      - uses: actions/cache/save@v6
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/player/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Validate bundled video runtime
        run: node _scripts/verify-release.mjs --arch ${{ matrix.arch }} --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: Media-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/releases/*
          if-no-files-found: error
          compression-level: 0
      - name: Open packaged application and check video workspace
        if: runner.os != 'Linux'
        run: node _scripts/smoke-portable.mjs --arch ${{ matrix.arch }} --target ${{ matrix.target }}
      - name: Open packaged Linux application and check renderer sandbox
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node _scripts/smoke-portable.mjs --arch ${{ matrix.arch }} --target ${{ matrix.target }}
      - name: Save runtime verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/verify/${{ matrix.platform }}-${{ matrix.arch }}/runtime.*
          if-no-files-found: ignore

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          pattern: Media-*
          path: build/releases
          merge-multiple: true
      - name: Generate combined checksums
        run: node _scripts/checksums.mjs build/releases
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            gh release create "$RELEASE_REF_NAME" build/releases/* --verify-tag --title "Media $RELEASE_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          else
            version=$(node -p "require('./packages/player/src-tauri/tauri.conf.json').version")
            if tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq '.object.sha'); then
              test "$tag_commit" = "$GITHUB_SHA"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$version" -f "sha=$GITHUB_SHA"
            fi
            gh release create "v$version" build/releases/* --verify-tag --target "$GITHUB_SHA" --title "Media v$version" --notes-file docs/RELEASE_NOTES.md
          fi
